# 这个文件告诉 GitHub Actions：要编译哪个"板子 + 键盘"组合
# 板子 board：nice_nano（nice!nano，默认 revision 就是 2.0.0 = 你手上的 v2）
# 键盘 shield：ppt_remote（我们的 11 键遥控器，文件在 boards/shields/ppt_remote/）

include:
  - board: nice_nano
    shield: ppt_remote
    # 如果 Actions 报错说找不到 "nice_nano" 这个 board，把上面那行改成下面这样再提交：
    # board: nice_nano//zmk
