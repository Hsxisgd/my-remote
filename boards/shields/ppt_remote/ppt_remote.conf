# 这个键盘额外打开/关闭的功能。每一行都可以删掉（删了就恢复默认）。
# 参考：https://zmk.dev/docs/config/power 和 https://zmk.dev/docs/config/bluetooth

# --- 省电：闲置 15 分钟后进入深度休眠，按任意键唤醒 -------------------------
# 想让它一直保持连接就删掉这行（费电一些）。
CONFIG_ZMK_SLEEP=y

# --- 连接稳定性：官方说这是"将来会变成默认"的一组设置 ----------------------
# 目前它做的事只是关掉 2M PHY，换来更保守、更稳的连接。
# 如果编译报错或者觉得有问题，删掉这行即可。
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# --- 如果电脑里留着"旧的配对记录"导致连不上，可以再打开下面这行 ------------
# 它允许用新配对覆盖旧主机的密钥（打开后需要在电脑上删除设备、重新配对一次）。
# CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# --- 顺便记录：本板还支持 USB 键盘（插 USB 线就是有线键盘），无需额外配置 ---
